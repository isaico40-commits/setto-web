<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Setto Luckyslot</title>
<script>if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed"); else if (window.top === window.self) location.replace("/?maquinita"); // sin página propia: se juega en el pop up</script>
<link rel="icon" href="img/mochito-cup.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout: una sola columna; la máquina es la protagonista y abajo, mínimo, los premios. Mismo sistema visual que setto.com.ar. */
:root{
  --bg:#FAF4E8; --bg-2:#F1E4CA; --card:#FFFDF8;
  --ink:#1F1C18; --ink-2:#5B5549;
  --turquesa:#296A67; --turquesa-2:#1F5452;
  --coral:#F8A29A; --coral-2:#FBC9C2; --oro:#F2C14E;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --texto:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --line:2px solid var(--turquesa);
  --sombra:5px 5px 0 var(--turquesa);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--texto);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.05;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.wrap > *{min-width:0}
html,body{overflow-x:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top img{height:30px;width:auto}
.sonido{width:36px;height:36px;border-radius:50%;border:var(--line);background:var(--card);color:var(--turquesa);display:grid;place-items:center}
.sonido svg{width:16px;height:16px}

/* ---------- la máquina: gabinete de tragamonedas (cartel arriba, rodillos, pantalla y tablero) ---------- */
.maq{--oro:#F2C14E;--lcd:#0F2F2E;position:relative;display:grid;gap:12px;justify-items:center;padding:30px 14px 18px;margin-top:16px;
  background:linear-gradient(180deg,#2F7A76,var(--turquesa) 38%,var(--turquesa-2));border-radius:30px 30px 22px 22px;border:3px solid var(--turquesa-2);
  box-shadow:inset 0 0 0 3px rgba(242,193,78,.55),6px 6px 0 var(--turquesa-2);color:var(--card)}
.tope{position:absolute;top:-24px;left:50%;width:46px;height:46px;margin-left:-23px;display:grid;place-items:center;border-radius:50%;background:var(--turquesa-2);border:3px solid var(--oro);z-index:1}
.tope svg{width:26px;height:26px}
.cartel{width:100%;display:grid;justify-items:center;gap:0;padding:12px 12px 10px;border-radius:50% 50% 16px 16px / 44px 44px 16px 16px;
  background:radial-gradient(120% 140% at 50% 0,#2D7471,#123E3C 70%);border:3px solid var(--oro);box-shadow:inset 0 0 0 2px var(--turquesa-2),0 3px 0 var(--turquesa-2)}
.cartel span{font-size:.72rem;font-weight:700;letter-spacing:.38em;text-transform:uppercase;color:var(--oro);padding-left:.38em}
.cartel h1{font-size:clamp(2rem,9vw,2.7rem);color:var(--coral);text-shadow:0 0 14px rgba(248,162,154,.55),0 3px 0 var(--turquesa-2);letter-spacing:.01em}
.maq.girando .cartel h1{animation:neon .5s ease-in-out infinite alternate}
@keyframes neon{to{text-shadow:0 0 22px rgba(248,162,154,.95),0 0 4px #fff,0 3px 0 var(--turquesa-2)}}

.ventana{--h:96px;position:relative;width:100%;background:var(--turquesa-2);border-radius:18px;padding:7px;border:3px solid var(--oro);box-shadow:inset 0 4px 8px rgba(0,0,0,.35);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.ventana::before,.ventana::after{content:"";position:absolute;top:50%;width:0;height:0;margin-top:-7px;border-block:7px solid transparent;z-index:2}
.ventana::before{left:-3px;border-left:9px solid var(--coral)}
.ventana::after{right:-3px;border-right:9px solid var(--coral)}
.reel{height:var(--h);overflow:hidden;border-radius:10px;background:linear-gradient(90deg,#E9DCC2,var(--card) 22%,var(--card) 78%,#E9DCC2);position:relative;transition:box-shadow .2s}
.reel::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(15,47,46,.45),transparent 26%,transparent 74%,rgba(15,47,46,.45))}
.strip{display:grid;will-change:transform}
.sym{height:var(--h);display:grid;place-items:center;padding:8px}
.sym img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(31,28,24,.18))}
.sym svg{width:80%;height:80%}
.reel.win{box-shadow:inset 0 0 0 3px var(--oro),0 0 14px rgba(242,193,78,.8)}
@media (max-width:420px){.ventana{--h:70px;gap:3px;padding:5px}.sym{padding:4px}}

/* pantalla: el mensaje como el display de una máquina real */
.msg{width:100%;min-height:3.4em;display:grid;place-items:center;text-align:center;font-weight:600;font-size:.92rem;padding:8px 12px;border-radius:12px;
  background:var(--lcd);border:2px solid #0B2524;box-shadow:inset 0 2px 8px rgba(0,0,0,.55);color:var(--card)}
.msg b{font-family:var(--display);font-weight:400;font-size:1.45rem;color:var(--oro);display:block;text-shadow:0 0 10px rgba(242,193,78,.45)}

/* tablero: fichas a la izquierda, botón a la derecha */
.tablero{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(11,37,36,.35);border-radius:18px;padding:10px 10px 10px 14px}
.tirar{font-family:var(--display);font-size:1.45rem;border:3px solid var(--turquesa-2);background:radial-gradient(circle at 40% 30%,#FFD4CF,var(--coral) 60%);color:var(--ink);border-radius:999px;padding:10px 32px;box-shadow:0 5px 0 #0B2524;transition:transform .08s,box-shadow .08s}
.tirar:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #0B2524}
.tirar:disabled{opacity:.5;cursor:not-allowed}
.fichas{display:flex;gap:8px;align-items:center;font-size:.82rem;color:var(--coral-2);line-height:1.2;min-width:0}
.fichas b{display:block;font-family:var(--display);font-weight:400;font-size:1.35rem;color:var(--card)}
.ficha{flex:none;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,var(--oro) 38%,#e2ab33 40%,#e2ab33 52%,var(--oro) 54%);border:2px solid #0B2524;box-shadow:0 2px 0 #0B2524}
.ficha.vacia{background:transparent;border:2px dashed var(--coral-2);box-shadow:none;opacity:.6}

/* ---------- premios: tarjetas con la combinación, el premio y la chance ---------- */
.premios{display:grid;gap:8px}
.pz-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-inline:2px}
.pz-h h2{font-size:1.3rem;color:var(--turquesa)}
.pz-h span{font-size:.76rem;color:var(--ink-2)}
.pz{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;background:var(--card);border:var(--line);border-radius:16px;padding:10px 12px}
.pz.top{background:linear-gradient(90deg,#FFF6DD,var(--card) 60%);border-color:var(--turquesa-2);box-shadow:3px 3px 0 var(--turquesa)}
.pz-combo{display:flex;align-items:center;background:var(--bg-2);border-radius:999px;padding:5px 8px}
.pz-combo img,.pz-combo svg{width:20px;height:20px;object-fit:contain;margin-right:-3px}
.pz-combo i{width:12px;height:12px;border-radius:50%;background:var(--coral);border:2px solid var(--turquesa);margin-right:3px}
.pz-combo i.no{background:transparent;border-style:dashed;opacity:.6}
.pz-combo i:last-child{margin-right:0}
.pz-t b{display:block;font-weight:700;font-size:.92rem;line-height:1.2}
.pz-t small{display:block;font-size:.76rem;color:var(--ink-2)}
.pz-pct{font-weight:700;font-size:.82rem;color:var(--card);background:var(--turquesa);border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.reglas{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.reglas li{display:flex;align-items:center;gap:6px;background:var(--bg-2);border-radius:999px;padding:5px 12px;font-size:.78rem;color:var(--ink-2)}
.reglas li b{color:var(--ink);font-weight:600}
.letra{font-size:.78rem;color:var(--ink-2);text-align:center}

details.test{font-size:.82rem;color:var(--ink-2);text-align:center;background:var(--card);border:2px dashed var(--turquesa);border-radius:16px;padding:10px 12px}
details.test summary{cursor:pointer;font-weight:700;color:var(--turquesa)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.chip{border:2px solid var(--turquesa);background:var(--card);border-radius:999px;padding:4px 11px;font-size:.78rem;font-weight:600;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--turquesa);color:var(--card)}

/* ---------- tu número y tus premios ---------- */
.jugador{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;background:var(--card);border:var(--line);border-radius:18px;padding:12px 14px;font-size:.9rem}
.jugador form{display:flex;gap:8px}
.jugador input{flex:1;min-width:0;width:100%;font:inherit;border:var(--line);border-radius:999px;padding:8px 14px;background:var(--bg)}
.jugador .btn{border:var(--line);background:var(--turquesa);color:var(--card);border-radius:999px;padding:8px 16px;font-weight:600}
.jugador .linea{display:flex;justify-content:space-between;align-items:center;gap:12px}
.jug-info{display:grid;min-width:0;line-height:1.3}
.jug-info small{font-size:.78rem}
.jug-info b{font-size:1.02rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.btn-sec{flex:none;border:var(--line);background:transparent;color:var(--turquesa);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.82rem;white-space:nowrap}
.btn-sec:hover{background:var(--bg-2)}
.jugador small{color:var(--ink-2);display:block}
.jugador .avisos{display:flex;gap:8px;align-items:flex-start;font-size:.82rem;line-height:1.35;cursor:pointer}
.jugador .avisos input{flex:none;width:18px;height:18px;margin:1px 0 0;padding:0;border:0;border-radius:4px;accent-color:var(--turquesa)}
.jugador .avisos a{color:var(--turquesa)}
.jugador[hidden]{display:none}
.reclamo{border-color:var(--turquesa);box-shadow:0 0 0 3px rgba(41,106,103,.15)}
.reclamo p{margin:0}
.reclamo .vence{display:inline-block;margin-top:4px;font-size:.78rem;font-weight:700;color:#9A3A32;background:rgba(248,162,154,.22);border-radius:999px;padding:2px 9px}
.reclamo label.f{display:grid;gap:4px;font-size:.82rem;font-weight:600}
.reclamo input#tel{flex:none}
.reclamo input#tel:disabled{opacity:.75}
.reclamo .canjear{width:100%;padding:11px 16px;font-size:1rem}
.reclamo .chk{display:grid;gap:8px}
.reclamo .chk small{font-size:.74rem}
.mio .usar{flex:none;border:var(--line);background:var(--turquesa);color:var(--card);border-radius:999px;padding:5px 12px;font-weight:600;font-size:.8rem}
.mio .dato{display:grid;min-width:0}
.mio .dato small{font-size:.74rem;color:var(--ink-2)}
.reclamo .err{color:#B3261E}
.reclamo .err:empty{display:none}
.mios{display:grid;gap:6px}
.mios h2{font-size:1.15rem;color:var(--turquesa)}
.mio{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:var(--line);border-radius:14px;padding:8px 12px;font-size:.88rem}
.mio code{font-weight:700;letter-spacing:.04em;color:var(--turquesa-2)}
.msg small{display:block;font-weight:500;font-size:.8rem;color:var(--coral-2)}
.msg code{font-weight:700;letter-spacing:.05em;color:var(--lcd);background:var(--oro);border-radius:8px;padding:1px 7px}
canvas#confeti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.aviso-prueba{max-width:560px;margin:0 auto 14px;background:var(--coral-2);border-radius:999px;padding:6px 14px;text-align:center;font-size:.8rem;font-weight:600}
body{margin:0}
/* dentro del pop up de la landing: sin logo (la X del pop up queda arriba a la derecha) */
.embed body{padding-block:12px 28px}
.embed .top{justify-content:flex-start}
.embed .top > a{display:none}
.embed .aviso-prueba{margin-right:56px}
/* palanca al costado de la máquina */
.maq{position:relative;margin-right:34px}
.palanca{all:unset;cursor:pointer;position:absolute;right:-37px;top:118px;width:34px;height:150px}
.palanca:focus-visible{outline:3px solid var(--coral);outline-offset:3px;border-radius:8px}
.palanca:disabled{cursor:not-allowed}
.eje{position:absolute;left:0;bottom:22px;width:22px;height:30px;border-radius:0 10px 10px 0;background:var(--turquesa-2)}
.brazo{position:absolute;left:14px;bottom:34px;width:7px;height:104px;border-radius:4px;background:linear-gradient(90deg,#c9c3b6,#f3efe6 45%,#a9a296);transform-origin:50% 100%;transition:transform .12s}
.bola{position:absolute;left:50%;top:-14px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd4cf,var(--coral) 55%,#e07e74);border:2.5px solid var(--turquesa-2)}
.palanca:hover:not(:disabled) .brazo{transform:rotate(6deg)}
.maq.tirando .brazo{animation:tirar-palanca .55s cubic-bezier(.4,0,.3,1)}
@keyframes tirar-palanca{0%{transform:perspective(260px) rotateX(0)}45%,62%{transform:perspective(260px) rotateX(165deg)}100%{transform:perspective(260px) rotateX(0)}}
@media (prefers-reduced-motion:reduce){.maq.tirando .brazo{animation:none}}
@media (max-width:420px){.maq{margin-right:30px}.palanca{right:-33px;top:104px;transform:scale(.88);transform-origin:0 50%}}
</style>
</head>
<body>
<p class="aviso-prueba" hidden>Modo prueba: los premios no son reales</p>

<div class="wrap">
  <header class="top">
    <a href="/"><img src="img/logo.svg" alt="Setto"></a>
    <button class="sonido" id="sonido" type="button" aria-pressed="false" aria-label="Activar sonido"></button>
  </header>

  <section class="jugador" id="jugador" aria-label="Tu número" hidden></section>

  <section class="maq" aria-label="Setto Luckyslot">
    <span class="tope" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17.1 6.1 20.3l1.3-6.5L2.5 9.3l6.6-.8z" fill="#F2C14E" stroke="#1F5452" stroke-width="1.4" stroke-linejoin="round"/></svg></span>
    <div class="cartel"><span>Setto</span><h1>Luckyslot</h1></div>
    <div class="ventana" id="ventana">
      <div class="reel"><div class="strip"></div></div>
      <div class="reel"><div class="strip"></div></div>
      <div class="reel"><div class="strip"></div></div>
      <div class="reel"><div class="strip"></div></div>
      <div class="reel"><div class="strip"></div></div>
    </div>
    <p class="msg" id="msg" aria-live="polite">¡Probá suerte!</p>
    <div class="tablero">
      <div class="fichas" id="fichas" aria-live="polite"></div>
      <button class="tirar" id="tirar" type="button">Tirar</button>
    </div>
    <button class="palanca" id="palanca" type="button" aria-label="Bajar la palanca y tirar"><span class="brazo"><span class="bola"></span></span><span class="eje"></span></button>
  </section>

  <section class="jugador reclamo" id="reclamo" aria-label="Canjear tu premio" hidden></section>
  <section class="mios" id="mios" aria-label="Tus premios" hidden></section>
  <details class="test" hidden>
    <summary>Modo prueba: elegí qué sale en la próxima tirada</summary>
    <div class="chips" id="forzar"></div>
    <div class="chips"><button class="chip" id="reponer" type="button">Sumar 5 fichas</button></div>
  </details>

  <section class="premios" id="premios" aria-label="Premios"></section>
  <ul class="reglas" id="letra"></ul>

</div>

<canvas id="confeti" aria-hidden="true"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/seed.js"></script>
<script src="js/api.js"></script>
<script>
(async function () {
  const $ = (s) => document.querySelector(s);
  const EMBED = document.documentElement.classList.contains("embed");
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  /* ajustes: Panel → Ajustes → Maquinita (tabla settings, lectura pública). Sin claves = modo demo del navegador. */
  async function cargarCfg() {
    const c = window.SETTO_CONFIG || {};
    try {
      if (c.supabaseUrl && c.supabaseAnonKey && !(window.SettoAPI || {}).DEMO) {
        const r = await fetch(`${c.supabaseUrl}/rest/v1/settings?key=eq.maquinita&select=value`, { headers: { apikey: c.supabaseAnonKey, Authorization: "Bearer " + c.supabaseAnonKey } });
        const d = await r.json(); return (d && d[0] && d[0].value) || {};
      }
      const db = JSON.parse(localStorage.getItem("setto-demo-db") || "null"); return (db && db.settings && db.settings.maquinita) || {};
    } catch (_) { return {}; }
  }
  const CFG = await cargarCfg();
  const API = window.SettoAPI;
  if (API.DEMO) { $(".aviso-prueba").hidden = false; $("details.test").hidden = false; $("details.test").open = true; }
  const DEF_SIM = [["mochito", "Mochito", "img/mochito-cup.png"], ["frutilla", "Mochi frutilla", "img/mochi-frutilla.webp"], ["oreo", "Mochi oreo", "img/mochi-oreo.webp"], ["dirty", "Dirty caramel", "img/dirty-caramel.webp"], ["matcha", "Strawberry matcha", "img/dirty-strawberry.webp"], ["estrella", "Estrella", ""]];
  const IMG = {}, NOMBRE = {};
  DEF_SIM.forEach(([k, n, img], i) => { const c = (CFG.simbolos || [])[i] || {}; IMG[k] = c.img || img; NOMBRE[k] = c.nombre || n; });
  const FICHAS = Math.max(1, Math.min(5, Math.round(+CFG.fichas_dia || 1)));
  if (CFG.aviso === false) $(".aviso-prueba").hidden = true;
  const ESTRELLA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17.1 6.1 20.3l1.3-6.5L2.5 9.3l6.6-.8z" fill="#F2C14E" stroke="#1F5452" stroke-width="1.4" stroke-linejoin="round"/></svg>';
  const SIMBOLOS = ["mochito", "frutilla", "oreo", "dirty", "matcha", "estrella"];
  const symHtml = (k) => !IMG[k] ? ESTRELLA : `<img src="${esc(IMG[k])}" alt="${esc(NOMBRE[k])}" draggable="false">`;
  const N = 5; // rodillos

  // La tabla se edita desde el panel; el resultado de cada tirada lo decide la base (maq_tirar)
  const DEF_PREM = { gift: ["Gift card $10.000", 0.1], mochi: ["Mochi gratis", 0.5], off: ["10% off", 2] };
  const puntos = (n) => "<i></i>".repeat(n) + '<i class="no"></i>'.repeat(5 - n);
  const COMBO = { gift: [() => symHtml("mochito").repeat(5), "5 Mochitos"], mochi: [() => puntos(5), "5 iguales"], off: [() => puntos(4), "4 iguales"] };
  const PREMIOS = ["gift", "mochi", "off"].map((id) => {
    const c = (CFG.premios || []).find((x) => x.id === id), d = DEF_PREM[id];
    return { id, titulo: c ? String(c.titulo || "").trim() : d[0], chance: c ? Math.max(0, +c.chance || 0) : d[1], combo: COMBO[id] };
  }).filter((p) => p.titulo && p.chance > 0);
  const fmt = (n) => n.toLocaleString("es-AR") + "%";
  $("#premios").innerHTML = `<div class="pz-h"><h2>Premios</h2><span>Chance por tirada</span></div>` + PREMIOS.map((p, i) => `<div class="pz ${i === 0 ? "top" : ""}"><span class="pz-combo" aria-hidden="true">${p.combo[0]()}</span><span class="pz-t"><b>${esc(p.titulo)}</b><small>${p.combo[1]}</small></span><span class="pz-pct">${fmt(p.chance)}</span></div>`).join("");

  /* ---------- tu número, fichas y premios (los guarda la base) ---------- */
  const COMPRA = Math.max(0, Math.min(50, Math.round(CFG.fichas_compra ?? 5)));
  $("#letra").innerHTML = `<li>🎟️ <span><b>${FICHAS === 1 ? "1 tirada gratis" : FICHAS + " tiradas gratis"}</b> por día</span></li>${COMPRA ? `<li>🛍️ <span><b>+${COMPRA} fichas</b> por compra</span></li>` : ""}<li>✨ <span>No apostás nada</span></li>`;
  // Para jugar no se pide el celular: la tirada gratis va por este dispositivo (y la base pone un tope por red).
  // Las fichas de compra van con el celular de los pedidos hechos en este celu. Si gana sin celular, lo pide para guardar el premio.
  const TEL = "setto-maq-tel", DEV = "setto-maq-dev";
  const nuevoDev = () => (crypto.randomUUID ? crypto.randomUUID() : Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, "0")).join(""));
  let dev = null;
  try { dev = localStorage.getItem(DEV); if (!/^[A-Za-z0-9-]{16,64}$/.test(dev || "")) { dev = nuevoDev(); localStorage.setItem(DEV, dev); } } catch (_) { dev = dev || nuevoDev(); }
  function telConocido() {
    const l = [];
    try { l.push(localStorage.getItem(TEL)); } catch (_) {}
    try { l.push(...JSON.parse(localStorage.getItem("setto-mis-pedidos") || "[]").map((x) => x.phone)); } catch (_) {}
    try { l.push(JSON.parse(localStorage.getItem("setto-form") || "{}").tel); } catch (_) {}
    return l.find((x) => x && API.normPhone(x)) || null;
  }
  let tel = telConocido();
  let est = null, forzado = null, girando = false, sonidoOn = true; // el sonido arranca prendido (se puede silenciar)
  const quedan = () => (est ? est.gratis + est.fichas : 0);
  const pesos = (n) => "$" + Math.round(n).toLocaleString("es-AR");

  function pintarJugador() {
    const j = $("#jugador");
    j.hidden = !tel; if (!tel) { j.innerHTML = ""; return; }
    j.innerHTML = `<div class="linea"><span class="jug-info"><small>Tus fichas van con</small><b>${esc(API.prettyPhone(tel))}</b></span><button class="btn-sec" id="cambiar" type="button">No soy yo</button></div>`;
    $("#cambiar").addEventListener("click", async () => { tel = null; canje = null; try { localStorage.removeItem(TEL); } catch (_) {} pintarJugador(); await cargarEstado(); });
  }
  // Ganó: se canjea en la misma visita. Pide el celular (si no lo sabemos), ofrece las casillas y lo deja aplicado en el carrito.
  let canje = null; // premio recién ganado con un número conocido (ya activo)
  const VERSION = "2026-10-pretildada"; // mismas casillas que el checkout, tildadas (decisión de Isa)
  function venceTxt(v) {
    if (!v) return ""; const m = Math.max(0, Math.round((new Date(v) - Date.now()) / 60000));
    return m >= 60 ? `Vence en ${Math.floor(m / 60)} h` : `Vence en ${m} min`;
  }
  // lo deja aplicado en el carrito de la web (misma pestaña)
  function aplicarEnCarrito(p, numero) {
    const m = { code: p.code, titulo: p.titulo, tipo: p.tipo, valor: p.valor, saldo: p.saldo, vence_at: p.vence_at || null, tel: numero };
    try { localStorage.setItem("setto-maq-usar", JSON.stringify(m)); const f = JSON.parse(localStorage.getItem("setto-form") || "{}") || {}; if (API.normPhone(f.tel) !== API.normPhone(numero)) localStorage.setItem("setto-form", JSON.stringify({ ...f, tel: numero })); } catch (_) {}
    try { if (window.parent !== window && window.parent.SettoCanjeMaq) { window.parent.SettoCanjeMaq(m); return true; } } catch (_) {}
    return false;
  }
  function pintarReclamo() {
    const r = $("#reclamo"), p = (est && est.pendiente) || canje;
    r.hidden = !p; if (!p) { r.innerHTML = ""; return; }
    const pend = !!(est && est.pendiente), v = pend ? tel || "" : tel;
    r.innerHTML = `<p><b>¡Ganaste ${esc(p.titulo)}!</b> Canjealo ahora y queda aplicado en tu pedido.<br><span class="vence">${esc(venceTxt(p.vence_at) || "Vence en 48 h")}</span></p>
      <form id="telForm" class="chk" novalidate>
        <label class="f" for="tel">Tu celular (WhatsApp)<input id="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="223 555-1234" value="${esc(v ? API.prettyPhone(v) : "")}" ${pend ? "" : "disabled"} required></label>
        <label class="avisos"><input type="checkbox" id="okWa" checked> <span>Avisame por WhatsApp cuando salgan sabores nuevos o limitados.</span></label>
        <label class="avisos"><input type="checkbox" id="okAds" checked> <span>Pueden usar mi número para mostrarme anuncios de Setto en Instagram y Facebook.</span></label>
        <small>Las dos son opcionales y te das de baja cuando quieras en <a href="/privacidad" target="_blank" rel="noopener">Privacidad y bajas</a>.</small>
        <button class="btn canjear" type="submit">Canjear premio</button>
      </form>
      <small class="err" id="telErr" aria-live="polite"></small>`;
    $("#telForm").addEventListener("submit", async (e) => {
      e.preventDefault(); const n = pend ? $("#tel").value : tel, b = $("#telForm .canjear");
      if (!API.normPhone(n)) { $("#telErr").textContent = "Revisá tu celular: código de área + número."; $("#tel").focus(); return; }
      b.disabled = true; $("#telErr").textContent = "";
      try {
        const g = pend ? await API.maqReclamar(dev, n) : p;
        tel = n; try { localStorage.setItem(TEL, n); } catch (_) {}
        const canales = [$("#okWa").checked && "whatsapp", $("#okAds").checked && "meta_ads"].filter(Boolean);
        if (canales.length && API.consentimientoMaquinita2) API.consentimientoMaquinita2(dev, n, canales, VERSION).catch(() => {});
        canje = null; pintarJugador(); await cargarEstado();
        const ok = aplicarEnCarrito(g, n);
        $("#msg").innerHTML = `<span><b>¡Listo!</b>${ok ? "Ya está aplicado en tu pedido." : `Ya está aplicado en tu pedido. Tu código: <code>${esc(g.code)}</code>`}</span>`;
      } catch (err) { b.disabled = false; $("#telErr").textContent = err.message; }
    });
  }
  function pintarMios() {
    const ps = (est && est.premios) || [], m = $("#mios");
    m.hidden = !ps.length; if (!ps.length) { m.innerHTML = ""; return; }
    m.innerHTML = `<h2>Tus premios</h2>` + ps.map((p) => `<div class="mio"><span class="dato"><span><b>${esc(p.titulo)}</b>${p.tipo === "monto" && p.saldo !== p.valor ? ` · te quedan ${pesos(p.saldo)}` : ""}</span><small><code>${esc(p.code)}</code>${p.vence_at ? " · " + esc(venceTxt(p.vence_at).toLowerCase()) : ""}</small></span><button class="usar" type="button" data-usar="${esc(p.code)}">Usar ahora</button></div>`).join("") +
      `<p class="letra">Se usan pidiendo en la web con este mismo número.</p>`;
    m.querySelectorAll("[data-usar]").forEach((b) => b.addEventListener("click", () => {
      const p = ps.find((x) => x.code === b.dataset.usar); if (!p) return;
      const ok = aplicarEnCarrito(p, tel); $("#msg").innerHTML = `<span><b>¡Listo!</b>${ok ? "Ya está aplicado en tu pedido." : `Usalo con tu código <code>${esc(p.code)}</code>`}</span>`;
    }));
    try { localStorage.setItem("setto-maq", JSON.stringify({ tel, premios: ps })); } catch (_) {}
  }
  async function cargarEstado() {
    try { est = await API.maqEstado2(dev, tel); } catch (e) { est = null; pintarFichas(); pintarMios(); pintarReclamo(); $("#msg").textContent = e.message; return; }
    pintarFichas(); pintarMios(); pintarReclamo();
  }
  function pintarFichas() {
    const n = quedan();
    if (!est) { $("#fichas").innerHTML = ""; $("#tirar").disabled = $("#palanca").disabled = true; if (!girando) $("#msg").textContent = "Cargando tus fichas…"; return; }
    $("#fichas").innerHTML = `<span class="ficha ${n ? "" : "vacia"}"></span><span><b class="num">${n}</b>${n === 1 ? "ficha" : "fichas"}${est.fichas && est.gratis ? ` · ${est.gratis} gratis` : ""}</span>`;
    $("#tirar").disabled = $("#palanca").disabled = n === 0 || girando;
    if (n > 0 && !girando && $("#msg").textContent === "Cargando tus fichas…") $("#msg").textContent = "¡Probá suerte!";
    if (n === 0 && !girando) $("#msg").textContent = COMPRA ? `Volvé mañana o sumá ${COMPRA} fichas con tu próxima compra` : "Volvé mañana por otra tirada";
  }

  /* ---------- rodillos ---------- */
  const reels = [...document.querySelectorAll(".reel")];
  const azar = () => SIMBOLOS[Math.floor(Math.random() * SIMBOLOS.length)];
  reels.forEach((r) => { r.querySelector(".strip").innerHTML = `<div class="sym">${symHtml(azar())}</div>`; });

  const mezclar = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const maxIguales = (a) => Math.max(...SIMBOLOS.map((s) => a.filter((x) => x === s).length));
  function finales(res) {
    const otros = SIMBOLOS.filter((s) => s !== "mochito"), pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
    if (res === "gift") return Array(N).fill("mochito");
    if (res === "mochi") return Array(N).fill(pick(otros));
    if (res === "off") { const s = pick(otros); return mezclar([s, s, s, s, pick(SIMBOLOS.filter((x) => x !== s))]); }
    let t; do { t = Array.from({ length: N }, azar); } while (maxIguales(t) >= 4); // sin premio: al azar, nunca 4 o 5 iguales
    return t;
  }

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  async function girar() {
    if (girando) return;
    if (quedan() === 0) return;
    if (sonidoOn) { try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); ac.resume && ac.resume(); } catch (_) {} } // el toque en Tirar habilita el audio
    const maq = $(".maq"); maq.classList.remove("tirando"); void maq.offsetWidth; maq.classList.add("tirando"); setTimeout(() => maq.classList.remove("tirando"), 600);
    girando = true; pintarFichas(); reels.forEach((r) => r.classList.remove("win"));
    $("#msg").textContent = "…"; luces(true); beep(330, .05);
    let r0;
    try { const f = forzado; forzado = null; marcar(); r0 = await API.maqTirar2(dev, tel, API.DEMO ? f : undefined); }
    catch (e) { girando = false; luces(false); $("#msg").textContent = e.message; await cargarEstado(); return; }
    est = Object.assign(est || { premios: [] }, { gratis: r0.gratis, fichas: r0.fichas });
    const res = r0.resultado, fin = finales(res), h = reels[0].getBoundingClientRect().height;
    Promise.all(reels.map((r, i) => new Promise((ok) => {
      const strip = r.querySelector(".strip"), items = [strip.lastElementChild.innerHTML];
      const vueltas = reduce ? 3 : 14 + i * 5;
      for (let k = 0; k < vueltas; k++) items.push(symHtml(azar()));
      items.push(symHtml(fin[i]));
      strip.style.transition = "none"; strip.style.transform = "translateY(0)";
      strip.innerHTML = items.map((x) => `<div class="sym">${x}</div>`).join("");
      void strip.offsetHeight;
      const dur = reduce ? 300 : 900 + i * 380;
      strip.style.transition = `transform ${dur}ms cubic-bezier(.12,.8,.2,1.04)`;
      strip.style.transform = `translateY(${-(items.length - 1) * h}px)`;
      setTimeout(() => { strip.innerHTML = `<div class="sym">${symHtml(fin[i])}</div>`; strip.style.transition = "none"; strip.style.transform = "translateY(0)"; beep(220 + i * 60, .07); ok(); }, dur + 30);
    }))).then(() => { girando = false; luces(false); resultado(r0, fin); });
  }

  function resultado(r0, fin) {
    const res = r0.resultado;
    if (res === "nada" || (!r0.code && !r0.pendiente)) { pintarFichas(); if (quedan() > 0) $("#msg").textContent = "¡Casi! Tirá de nuevo"; else if (!COMPRA) $("#msg").textContent = "¡Casi! Volvé mañana"; return; }
    const top = SIMBOLOS.find((s) => fin.filter((x) => x === s).length >= 4);
    reels.forEach((r, i) => { if (fin[i] === top) r.classList.add("win"); });
    const html = `<span><b>¡${esc(r0.titulo)}!</b><small>Canjealo acá abajo: queda aplicado en tu pedido.</small></span>`;
    fanfarria(res === "gift"); confeti(res === "gift" ? 220 : res === "mochi" ? 140 : 70);
    cargarEstado().then(() => {
      if (!r0.pendiente) canje = ((est && est.premios) || []).find((x) => x.code === r0.code) || null;
      pintarReclamo(); $("#msg").innerHTML = html;
      setTimeout(() => { $("#reclamo").scrollIntoView({ behavior: "smooth", block: "center" }); const t = $("#tel"); if (t && !t.disabled) t.focus({ preventScroll: true }); }, 900);
    }); // el premio queda a la vista aunque no queden fichas
  }

  $("#tirar").addEventListener("click", girar);
  $("#palanca").addEventListener("click", girar);

  /* ---------- cartel: brilla mientras gira ---------- */
  const luces = (on) => $(".maq").classList.toggle("girando", on);

  /* ---------- sonido (opcional, arranca apagado) ---------- */
  const OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>';
  const ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
  let ac = null; $("#sonido").innerHTML = sonidoOn ? ON : OFF; $("#sonido").setAttribute("aria-pressed", sonidoOn); if (sonidoOn) $("#sonido").setAttribute("aria-label", "Silenciar");
  $("#sonido").addEventListener("click", () => {
    sonidoOn = !sonidoOn; $("#sonido").innerHTML = sonidoOn ? ON : OFF;
    $("#sonido").setAttribute("aria-pressed", sonidoOn); $("#sonido").setAttribute("aria-label", sonidoOn ? "Silenciar" : "Activar sonido");
    if (sonidoOn && !ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
    if (sonidoOn) beep(520, .08);
  });
  function beep(f, d, t0 = 0) {
    if (!sonidoOn || !ac) return;
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + t0;
    o.type = "square"; o.frequency.value = f; g.gain.setValueAtTime(.05, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .02);
  }
  function fanfarria(grande) { [523, 659, 784, 1047].concat(grande ? [784, 1047, 1319] : []).forEach((f, i) => beep(f, .14, i * .11)); }

  /* ---------- confeti ---------- */
  const cv = $("#confeti"), cx = cv.getContext("2d");
  function confeti(n) {
    if (reduce) return;
    const d = devicePixelRatio || 1, W = (cv.width = innerWidth * d), H = (cv.height = innerHeight * d);
    const cols = ["#F8A29A", "#296A67", "#F2C14E", "#D0DEC3", "#FBC9C2"];
    const ps = Array.from({ length: n }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35, vx: (Math.random() - .5) * 18 * d, vy: (-Math.random() * 16 - 6) * d, r: (4 + Math.random() * 5) * d, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6, va: (Math.random() - .5) * .4 }));
    let f = 0;
    (function frame() {
      cx.clearRect(0, 0, W, H); f++;
      ps.forEach((p) => { p.vy += .55 * d; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.a += p.va; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c; cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); cx.restore(); });
      if (f < 150) requestAnimationFrame(frame); else cx.clearRect(0, 0, W, H);
    })();
  }

  /* ---------- prueba ---------- */
  const OPC = [["gift", "Gift card"], ["mochi", "Mochi"], ["off", "10% off"], ["nada", "Nada"]];
  $("#forzar").innerHTML = OPC.map(([k, l]) => `<button class="chip" type="button" data-f="${k}" aria-pressed="false">Próxima: ${l}</button>`).join("");
  function marcar() { document.querySelectorAll("[data-f]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.f === forzado)); }
  $("#forzar").addEventListener("click", (e) => { const b = e.target.closest("[data-f]"); if (!b) return; forzado = forzado === b.dataset.f ? null : b.dataset.f; marcar(); });
  // solo demo: suma fichas a este dispositivo para seguir probando
  $("#reponer").addEventListener("click", async () => {
    if (!API.DEMO) return;
    await API.maqSumarDemo(dev, 5); // fichas de prueba para este dispositivo, con o sin número
    await cargarEstado(); $("#msg").textContent = "¡Probá suerte!";
  });
  pintarJugador(); pintarFichas(); cargarEstado();
})();
</script>
</body>
